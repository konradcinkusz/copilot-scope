# Client mode without Aspire: collector + dashboard + Postgres in containers.
#   cp .env.example .env   # then set COPILOTSCOPE_API_KEY and POSTGRES_PASSWORD
#   docker compose up --build
#   Dashboard:  http://localhost:5200
#   OTLP:       http://localhost:4318   (VS Code -> github.copilot.chat.otel.otlpEndpoint)
#   Auth ingest: OTEL_EXPORTER_OTLP_HEADERS=x-api-key=$COPILOTSCOPE_API_KEY before starting VS Code.
# The compose vars have no default on purpose — an unset value fails loudly here
# instead of shipping a known key into a running deployment.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: copilotdb
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - copilotscope-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilotdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4318:4318"
    environment:
      ConnectionStrings__copilotdb: "Host=postgres;Database=copilotdb;Username=copilot;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      CopilotScope__Ingest__ApiKey: ${COPILOTSCOPE_API_KEY:?set COPILOTSCOPE_API_KEY in .env}
      # Optional forward to a second OTLP backend (e.g. Grafana Cloud):
      # CopilotScope__Forward__Endpoint: "https://otlp-gateway-....grafana.net/otlp"
      # CopilotScope__Forward__Headers__Authorization: "Basic <base64>"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "5200:8080"
    environment:
      Collector__BaseUrl: "http://collector:4318"
      # The collector's /api group is gated by the ingest key, so the dashboard
      # presents the same key.
      CopilotScope__Ingest__ApiKey: ${COPILOTSCOPE_API_KEY:?set COPILOTSCOPE_API_KEY in .env}
    depends_on:
      - collector
    restart: unless-stopped

  # Opt-in, experimental — see docs/AGENTFORGE.md before enabling for a team. No cohorts are
  # configured by default, so this serves no persona traffic until you edit appsettings.
  agentforge:
    build:
      context: .
      dockerfile: Dockerfile.agentforge
    ports:
      - "5300:8080"
    environment:
      CopilotScope__AgentForge__CollectorBaseUrl: "http://collector:4318"
      # CopilotScope__AgentForge__Ingest__ApiKey: ${COPILOTSCOPE_API_KEY}
      # CopilotScope__AgentForge__AzureAI__Endpoint: "https://<your-foundry-resource>.openai.azure.com"
      # CopilotScope__AgentForge__AzureAI__DeploymentName: "<your-model-deployment>"
      # CopilotScope__AgentForge__AzureAI__ApiKey: "<your-key>"   # omit to use DefaultAzureCredential
    depends_on:
      - collector
    restart: unless-stopped

  # Opt-in, cloud-only — see docs/JUDGE_AGENT.md before enabling for a team. Without Azure AI
  # credentials below, /api/sessions/{id}/judge returns a clear "not configured" error.
  judgeagent:
    build:
      context: .
      dockerfile: Dockerfile.judgeagent
    ports:
      - "5400:8080"
    environment:
      CopilotScope__JudgeAgent__CollectorBaseUrl: "http://collector:4318"
      # CopilotScope__JudgeAgent__Ingest__ApiKey: ${COPILOTSCOPE_API_KEY}
      # CopilotScope__JudgeAgent__AzureAI__Endpoint: "https://<your-foundry-resource>.openai.azure.com"
      # CopilotScope__JudgeAgent__AzureAI__DeploymentName: "<your-model-deployment>"
      # CopilotScope__JudgeAgent__AzureAI__ApiKey: "<your-key>"   # omit to use DefaultAzureCredential
    depends_on:
      - collector
    restart: unless-stopped

volumes:
  copilotscope-pgdata:
