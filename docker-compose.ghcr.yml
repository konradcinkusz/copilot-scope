# Pull-and-run — NO repository clone needed. Download just this file:
#   Linux/macOS/Git Bash: curl -O https://raw.githubusercontent.com/konradcinkusz/copilotscope/master/docker-compose.ghcr.yml
#   Windows PowerShell:   curl.exe -O https://raw.githubusercontent.com/konradcinkusz/copilotscope/master/docker-compose.ghcr.yml
# Then set the two required secrets (no default — an unset value fails loudly
# rather than shipping a known key), e.g.:
#   export COPILOTSCOPE_API_KEY=$(openssl rand -hex 24)
#   export POSTGRES_PASSWORD=$(openssl rand -hex 16)
#   docker compose -f docker-compose.ghcr.yml up
# Dashboard: http://localhost:5200 · OTLP ingest: http://localhost:4318 (x-api-key: $COPILOTSCOPE_API_KEY)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: copilotdb
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see header)}
    volumes:
      - copilotscope-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilotdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    image: ghcr.io/konradcinkusz/copilotscope-collector:latest
    ports:
      - "4318:4318"
    environment:
      ConnectionStrings__copilotdb: "Host=postgres;Database=copilotdb;Username=copilot;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see header)}"
      CopilotScope__Ingest__ApiKey: ${COPILOTSCOPE_API_KEY:?set COPILOTSCOPE_API_KEY (see header)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    image: ghcr.io/konradcinkusz/copilotscope-dashboard:latest
    ports:
      - "5200:8080"
    environment:
      Collector__BaseUrl: "http://collector:4318"
      CopilotScope__Ingest__ApiKey: ${COPILOTSCOPE_API_KEY:?set COPILOTSCOPE_API_KEY (see header)}
    depends_on:
      - collector
    restart: unless-stopped

  # Opt-in, experimental — see docs/AGENTFORGE.md before enabling for a team. No cohorts are
  # configured by default, so this serves no persona traffic until you supply your own config.
  agentforge:
    image: ghcr.io/konradcinkusz/copilotscope-agentforge:latest
    ports:
      - "5300:8080"
    environment:
      CopilotScope__AgentForge__CollectorBaseUrl: "http://collector:4318"
    depends_on:
      - collector
    restart: unless-stopped

  # Opt-in, cloud-only — see docs/JUDGE_AGENT.md before enabling for a team. Without Azure AI
  # credentials this serves no judge traffic — /api/sessions/{id}/judge returns a clear
  # "not configured" error until you supply your own config.
  judgeagent:
    image: ghcr.io/konradcinkusz/copilotscope-judgeagent:latest
    ports:
      - "5400:8080"
    environment:
      CopilotScope__JudgeAgent__CollectorBaseUrl: "http://collector:4318"
    depends_on:
      - collector
    restart: unless-stopped

volumes:
  copilotscope-pgdata:
