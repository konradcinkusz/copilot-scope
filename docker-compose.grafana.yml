# CopilotScope + Prometheus + Grafana — everything provisioned, nothing to click.
#
#   docker compose -f docker-compose.grafana.yml up
#
# Grafana:    http://localhost:3000  (dashboard auto-loaded)
#
# Local-demo posture: Grafana runs with anonymous Admin and no login form so the
# dashboard is one command away. Do not expose this compose file's ports beyond
# localhost — for anything shared, drop the GF_AUTH_ANONYMOUS_* lines and set a
# real admin password.
# Dashboard:  http://localhost:5200
# Prometheus: http://localhost:9090
# OTLP ingest: http://localhost:4318 (x-api-key: $COPILOTSCOPE_API_KEY)
#
# Requires COPILOTSCOPE_API_KEY and POSTGRES_PASSWORD (copy .env.example to .env
# or export them). Prometheus scrapes the key-gated /metrics using the same key,
# written to a token file at startup from the env var.
#
# The collector's /metrics endpoint exports the *computed* signals — composite
# quality score, its components, edit survival, friction, cost. That is the part
# no other exporter has; raw OTLP relaying upstream is a separate feature
# (CopilotScope__Forwarding__*), not a substitute for this.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: copilotdb
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - copilotscope-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilotdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    image: ghcr.io/konradcinkusz/copilotscope-collector:latest
    ports:
      - "4318:4318"
    environment:
      ConnectionStrings__copilotdb: "Host=postgres;Database=copilotdb;Username=copilot;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      CopilotScope__Ingest__ApiKey: ${COPILOTSCOPE_API_KEY:?set COPILOTSCOPE_API_KEY in .env}
      # Per-session series are opt-in because session ids are unbounded. 200 is the
      # default ceiling; the newest sessions win and the rest are dropped rather
      # than handing Prometheus an ever-growing set of time series.
      CopilotScope__Prometheus__PerSession: "true"
      CopilotScope__Prometheus__MaxSessionSeries: "200"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    image: ghcr.io/konradcinkusz/copilotscope-dashboard:latest
    ports:
      - "5200:8080"
    environment:
      Collector__BaseUrl: "http://collector:4318"
      CopilotScope__Ingest__ApiKey: ${COPILOTSCOPE_API_KEY:?set COPILOTSCOPE_API_KEY in .env}
    depends_on:
      - collector
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    environment:
      COPILOTSCOPE_API_KEY: ${COPILOTSCOPE_API_KEY:?set COPILOTSCOPE_API_KEY in .env}
    # Prometheus does not expand env vars inside its config, so write the scrape
    # token to a file the config references (credentials_file), then exec the
    # normal entrypoint. The data volume is writable by the prometheus user.
    entrypoint:
      - /bin/sh
      - -c
      - >
        printf '%s' "$$COPILOTSCOPE_API_KEY" > /prometheus/scrape_token &&
        exec /bin/prometheus
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --web.console.libraries=/usr/share/prometheus/console_libraries
        --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - copilotscope-promdata:/prometheus
    depends_on:
      - collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "dark"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - copilotscope-grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  copilotscope-pgdata:
  copilotscope-promdata:
  copilotscope-grafanadata:
