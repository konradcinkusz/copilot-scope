# Builds and publishes the CopilotScope images to GitHub Container Registry
# when a release tag is pushed. Create a release via the GitHub UI — that
# automatically creates the tag and triggers this workflow. Images:
#   ghcr.io/konradcinkusz/copilotscope-collector
#   ghcr.io/konradcinkusz/copilotscope-dashboard
#   ghcr.io/konradcinkusz/copilotscope-tools
#   ghcr.io/konradcinkusz/copilotscope-agentforge
#   ghcr.io/konradcinkusz/copilotscope-judgeagent
#
# Tag convention: v<major>.<minor>.<patch> (a capital V is accepted and
# normalised). Each release produces three image tags: the version (1.0.8),
# major.minor (1.0) and latest. A tag that does not match the convention fails
# the workflow loudly rather than publishing nothing in silence.
#
# The matrix does NOT fail fast: one broken image must not cancel the others
# mid-push, which is how collector and dashboard ended up on different versions
# (see the v1.0.7 run). Note the flip side — a failed run can still leave a
# partial set published, so check every image before announcing a release.
#
# Note: GHCR publishes a *new* package private by default. After the first
# successful run for a newly added image, flip it in
# GitHub → Packages → <package> → Settings → Change visibility.
name: build containers

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Build provenance for the pushed image (ADR-004, decision 7): id-token signs it and
      # attestations stores it, with the repository and on GHCR beside the image.
      # artifact-metadata is what actions/attest asks for; it only matters for registry
      # storage records, which GitHub keeps for organization-owned repositories only.
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: copilotscope-collector
            dockerfile: Dockerfile
            smoke: http
            port: 4318
            healthpath: /api/health
          - image: copilotscope-dashboard
            dockerfile: Dockerfile.dashboard
            smoke: http
            port: 8080
            healthpath: /            # dashboard has no /api/health; the Blazor root answers 200
          # Console tools, not a server: nothing listens, so the smoke test runs the
          # entrypoint instead of polling a port.
          - image: copilotscope-tools
            dockerfile: Dockerfile.tools
            smoke: cli
            smokeargs: help
          - image: copilotscope-agentforge
            dockerfile: Dockerfile.agentforge
            smoke: http
            port: 8080
            healthpath: /api/health
          - image: copilotscope-judgeagent
            dockerfile: Dockerfile.judgeagent
            smoke: http
            port: 8080
            healthpath: /api/health
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolves the version tags explicitly instead of relying on the
      # metadata-action's semver parser, which only recognises a lowercase "v"
      # prefix — `V1.0.8` silently produced no version tags at all.
      - name: Resolve version tags
        id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            # Placeholders, never used: both version tags are gated on
            # is_release, and an empty value= is not worth relying on.
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "semver=0.0.0" >> "$GITHUB_OUTPUT"
            echo "major_minor=0.0" >> "$GITHUB_OUTPUT"
            echo "Manual run on '${GITHUB_REF_NAME}' — publishing :latest only."
            exit 0
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[vV]([0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            echo "::error title=Unrecognised release tag::'${GITHUB_REF_NAME}' is not v<major>.<minor>.<patch>. No images were published. Retag the release and re-run."
            exit 1
          fi
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "major_minor=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "semver=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${BASH_REMATCH[1]}.${BASH_REMATCH[2]}, ${BASH_REMATCH[1]} and latest."

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.semver }},enable=${{ steps.ver.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.ver.outputs.major_minor }},enable=${{ steps.ver.outputs.is_release == 'true' }}
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Build once, load into the local daemon, and smoke-test BEFORE publishing.
      # This is the gate that catches the class of failure that shipped v1.0.x
      # dead images (a runtime image on a different major than the TFM starts,
      # then exits with "framework not found"). The GHA layer cache makes the
      # second, push-only build near-instant.
      - name: Build image (load, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.image }}:smoke
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke test (server answers)
        if: matrix.smoke == 'http'
        run: |
          set -euo pipefail
          docker run -d --name smoke -p ${{ matrix.port }}:${{ matrix.port }} ${{ matrix.image }}:smoke
          ok=false
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${{ matrix.port }}${{ matrix.healthpath }}" >/dev/null 2>&1; then
              ok=true; break
            fi
            sleep 2
          done
          if [ "$ok" != true ]; then
            echo "::error title=Smoke test failed::${{ matrix.image }} did not answer ${{ matrix.healthpath }} on :${{ matrix.port }} within 60s."
            docker logs smoke || true
            docker rm -f smoke || true
            exit 1
          fi
          echo "${{ matrix.image }} is healthy."
          docker rm -f smoke

      # Same gate, different shape: a console image has no port to poll, so the
      # check is that the entrypoint runs and exits 0 on the published runtime —
      # which is what catches a TFM/runtime mismatch here too.
      - name: Smoke test (entrypoint runs)
        if: matrix.smoke == 'cli'
        run: |
          set -euo pipefail
          if ! output=$(docker run --rm ${{ matrix.image }}:smoke ${{ matrix.smokeargs }} 2>&1); then
            echo "::error title=Smoke test failed::${{ matrix.image }} entrypoint exited non-zero."
            echo "$output"
            exit 1
          fi
          echo "$output"
          echo "${{ matrix.image }} entrypoint runs."

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}

      # A signed statement that this workflow run built the image with this digest from this
      # commit, stored with the repository and pushed to GHCR beside the image. Checked with
      # `gh attestation verify oci://ghcr.io/<owner>/<image>:<tag> --repo <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
