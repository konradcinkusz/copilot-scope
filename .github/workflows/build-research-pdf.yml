name: Build Research PDF

on:
  push:
    tags:
      # Both cases, for the same reason as build-containers.yml: a tag pushed as
      # V1.0.8 matched nothing here, so that release carries no PDF assets and
      # the README's research-paper badge (which points at
      # releases/latest/download/...) breaks as soon as such a release is latest.
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (leave empty to auto-generate for manual runs)'
        required: false
        default: ''

permissions:
  contents: write
  # Build provenance for the PDFs (ADR-004, decision 7), as release-native.yml gives the
  # archives: id-token signs, attestations stores; artifact-metadata is what actions/attest
  # asks for and only matters for organization-owned repositories.
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build quality measurement framework
        uses: xu-cheng/latex-action@v4
        with:
          root_file: quality_measurement_framework.tex
          working_directory: research/articles
      - name: Build thesis topics
        uses: xu-cheng/latex-action@v4
        with:
          root_file: thesis_topics.tex
          working_directory: research/articles
      - name: Rename PDFs
        run: |
          mv research/articles/quality_measurement_framework.pdf CopilotScope_Quality_Framework.pdf
          mv research/articles/thesis_topics.pdf CopilotScope_Thesis_Topics.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: CopilotScope_Research_PDFs
          path: |
            CopilotScope_Quality_Framework.pdf
            CopilotScope_Thesis_Topics.pdf

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CopilotScope_Research_PDFs
      # A signed statement that this workflow run built these PDFs from this commit, checked
      # with `gh attestation verify <file>.pdf --repo <owner>/<repo>` like the archives.
      - uses: actions/attest@v4
        with:
          subject-path: |
            CopilotScope_Quality_Framework.pdf
            CopilotScope_Thesis_Topics.pdf
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || (inputs.tag_name != '' && inputs.tag_name || format('manual-run-{0}', github.run_number)) }}
          # A manual run publishes a PDF-only release. Marked as a pre-release and never
          # "latest": releases/latest/download/... is where the installers fetch the native
          # binaries (release-native.yml), and a PDF-only release there makes every download 404
          # — as manual-run-9 did, once it became the newest release.
          prerelease: ${{ github.event_name != 'push' }}
          make_latest: ${{ github.event_name == 'push' }}
          files: |
            CopilotScope_Quality_Framework.pdf
            CopilotScope_Thesis_Topics.pdf
