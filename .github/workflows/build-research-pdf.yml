name: Build Research PDF

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (leave empty to auto-generate for manual runs)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build quality measurement framework
        uses: xu-cheng/latex-action@v4
        with:
          root_file: quality_measurement_framework.tex
          working_directory: research/articles
      - name: Build thesis topics
        uses: xu-cheng/latex-action@v4
        with:
          root_file: thesis_topics.tex
          working_directory: research/articles
      - name: Rename PDFs
        run: |
          mv research/articles/quality_measurement_framework.pdf CopilotScope_Quality_Framework.pdf
          mv research/articles/thesis_topics.pdf CopilotScope_Thesis_Topics.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: CopilotScope_Research_PDFs
          path: |
            CopilotScope_Quality_Framework.pdf
            CopilotScope_Thesis_Topics.pdf

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CopilotScope_Research_PDFs
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || (inputs.tag_name != '' && inputs.tag_name || format('manual-run-{0}', github.run_number)) }}
          files: |
            CopilotScope_Quality_Framework.pdf
            CopilotScope_Thesis_Topics.pdf
