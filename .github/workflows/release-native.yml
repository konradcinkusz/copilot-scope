# Builds the native `copilotscope` archives (ADR-004) and, for a release tag, attaches them to
# that tag's GitHub Release with a SHA256SUMS file:
#
#   copilotscope-linux-x64.tar.gz   copilotscope-linux-arm64.tar.gz
#   copilotscope-osx-arm64.tar.gz   copilotscope-osx-x64.tar.gz
#   copilotscope-win-x64.zip        copilotscope-win-arm64.zip
#
# The names carry no version on purpose: releases/latest/download/<name> then always resolves
# to the newest release, which is what the installers and the README point at.
#
# Every platform is packaged AND smoke-tested on its own kind of runner (scripts/smoke-native.sh
# runs the extracted archive: dashboard assets, ingest, stop/start, no self-telemetry). A binary
# built on one machine and only ever run on another is how a release ships dead — the same
# lesson as the container smoke tests in build-containers.yml. macOS in particular must be
# built on macOS: the SDK signs the binary there, and an unsigned arm64 binary does not start.
#
# Triggers:
#   - a v<major>.<minor>.<patch> tag (capital V accepted, as in build-containers.yml): build,
#     test, attach, and mark that release "latest";
#   - a pull request touching the native binary or this workflow: build and test all six
#     platforms, attach nothing — so Windows, macOS and ARM breakage shows up before a tag does;
#   - a manual run: with `tag`, rebuild and re-attach that release's archives; without, build
#     and test only.
#
# Every file attached to a release carries SLSA build provenance (ADR-004, decision 7):
# `actions/attest` signs, through Sigstore, a statement that a workflow of this repository
# built that exact file from that exact commit, and stores it with the repository; `gh
# attestation verify <file> --repo <owner>/<repo>` checks it, and `--signer-workflow` pins
# it to this workflow. The release job here attests the six archives, the two installers and
# SHA256SUMS; build-research-pdf.yml attests the PDFs and build-containers.yml the images.
# SHA256SUMS comes from the same release, so it can only say that a download arrived intact —
# the attestation says where it came from. The two installer scripts ship as release assets
# as well, listed in SHA256SUMS and attested like the archives: `install.sh --version <tag>`
# (`-Version` on Windows) from that release's assets installs the release the script was
# tested with, rather than whatever master holds that day.
#
# Authenticode signing of the two Windows binaries is a job that runs only when the repository
# is configured for it — a Microsoft Artifact Signing (formerly Trusted Signing) account,
# reached through OpenID Connect, no certificate file in any secret:
#
#   vars.CODESIGN            azure-artifact-signing        (anything else: the job is skipped)
#   vars.CODESIGN_ENDPOINT   https://<region>.codesigning.azure.net/
#   vars.CODESIGN_ACCOUNT    the signing account name
#   vars.CODESIGN_PROFILE    the certificate profile name
#   secrets.AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#                            an app registration with a federated credential for this
#                            repository and the "Artifact Signing Certificate Profile Signer" role
#
# Off, the release goes out unsigned, as before: the installers download with curl and
# Invoke-WebRequest, which set no quarantine attribute or Mark-of-the-Web, and a browser
# download meets SmartScreen. macOS notarization needs an Apple certificate and is still to do.
name: release native

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  pull_request:
    paths:
      - .github/workflows/release-native.yml
      - scripts/package-native.sh
      - scripts/smoke-native.sh
      - scripts/test-install.sh
      - install.sh
      - install.ps1
      - src/CopilotScope.Local/**
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rebuild and attach archives to (e.g. v1.1.0). Empty: build and test only.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve the tag and version
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=""
          if [ "$EVENT" = "push" ]; then tag="$GITHUB_REF_NAME"; fi
          if [ "$EVENT" = "workflow_dispatch" ]; then tag="$INPUT_TAG"; fi
          if [ -z "$tag" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "Not a release: building and testing every platform, attaching nothing."
            exit 0
          fi
          if [[ ! "$tag" =~ ^[vV]([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error title=Unrecognised release tag::'$tag' is not v<major>.<minor>.<patch>. Nothing was built or attached."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "Building ${BASH_REMATCH[1]} for release $tag."

  build:
    needs: version
    strategy:
      # One broken platform must not cancel the others mid-build; the release job still waits
      # for all six, so a partial set is never attached.
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-15-intel
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Package ${{ matrix.rid }}
        run: scripts/package-native.sh "${{ matrix.rid }}" "${{ needs.version.outputs.version }}"

      - name: Smoke test the extracted archive
        run: scripts/smoke-native.sh artifacts/native/copilotscope-${{ matrix.rid }}.*

      # The installer a user runs, against this archive served as a release: install.sh on
      # macOS and Linux, install.ps1 on Windows.
      - name: Install it the way a user would
        run: scripts/test-install.sh artifacts/native/copilotscope-${{ matrix.rid }}.*

      - name: Keep the archive
        uses: actions/upload-artifact@v7
        with:
          name: copilotscope-${{ matrix.rid }}
          path: artifacts/native/copilotscope-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 7

  # Signs copilotscope.exe inside both Windows archives and puts the signed archives in place
  # of the unsigned ones. The signing action runs on x64 Windows runners only, which is why
  # this is a job of its own rather than a step in the build matrix, where win-arm64 is built
  # on an ARM runner. Signing changes the archive, so the x64 one is smoke-tested again before
  # it replaces the unsigned artifact; the arm64 binary cannot run here and keeps the smoke
  # test it passed unsigned. Skipped unless vars.CODESIGN says otherwise (see the header).
  sign-windows:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true' && vars.CODESIGN == 'azure-artifact-signing'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref }}

      - name: Collect the Windows archives
        uses: actions/download-artifact@v8
        with:
          pattern: copilotscope-win-*
          merge-multiple: true
          path: dist

      - name: Extract
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            Expand-Archive -Path "dist/copilotscope-$rid.zip" -DestinationPath unpacked -Force
            if (-not (Test-Path "unpacked/copilotscope-$rid/copilotscope.exe")) {
              throw "dist/copilotscope-$rid.zip holds no copilotscope.exe"
            }
          }

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign copilotscope.exe
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.CODESIGN_ENDPOINT }}
          signing-account-name: ${{ vars.CODESIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.CODESIGN_PROFILE }}
          files: |
            ${{ github.workspace }}\unpacked\copilotscope-win-x64\copilotscope.exe
            ${{ github.workspace }}\unpacked\copilotscope-win-arm64\copilotscope.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A signing step that silently did nothing would ship an unsigned binary under a release
      # note that says signed, so the signature is checked before anything is repacked.
      - name: Check the signatures
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            $sig = Get-AuthenticodeSignature "unpacked/copilotscope-$rid/copilotscope.exe"
            if ($sig.Status -ne 'Valid') { throw "copilotscope-$rid/copilotscope.exe: signature status is $($sig.Status)" }
            Write-Host "copilotscope-$rid/copilotscope.exe: signed by $($sig.SignerCertificate.Subject)"
          }

      # Repacked the way scripts/package-native.sh packs on a Windows runner (7-Zip), with the
      # same top-level folder, so the installers and the smoke test see the same layout.
      - name: Repack
        shell: bash
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64; do
            rm -f "dist/copilotscope-$rid.zip"
            (cd unpacked && 7z a -tzip -bso0 -bsp0 "../dist/copilotscope-$rid.zip" "copilotscope-$rid")
          done
          ls -l dist

      - name: Smoke test the signed x64 archive
        shell: bash
        run: scripts/smoke-native.sh dist/copilotscope-win-x64.zip

      - name: Replace the unsigned win-x64 archive
        uses: actions/upload-artifact@v7
        with:
          name: copilotscope-win-x64
          path: dist/copilotscope-win-x64.zip
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Replace the unsigned win-arm64 archive
        uses: actions/upload-artifact@v7
        with:
          name: copilotscope-win-arm64
          path: dist/copilotscope-win-arm64.zip
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, build, sign-windows]
    # Waits for signing when it runs and goes ahead when it is skipped; a failed build or a
    # failed signing job still attaches nothing.
    if: >-
      always()
      && needs.version.outputs.publish == 'true'
      && needs.build.result == 'success'
      && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: id-token mints the short-lived Sigstore signing certificate and
      # attestations stores the signed statement. artifact-metadata is what actions/attest
      # asks for; it only matters for registry storage records, which GitHub keeps for
      # organization-owned repositories only.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # The installers of this release, from this tag: they ship beside the archives so a
      # release can be installed with the script it was tested with.
      - name: Checkout the installers
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          sparse-checkout: |
            install.sh
            install.ps1
          sparse-checkout-cone-mode: false

      - name: Collect the archives
        uses: actions/download-artifact@v8
        with:
          pattern: copilotscope-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          count="$(find . -maxdepth 1 -name 'copilotscope-*' | wc -l)"
          if [ "$count" -ne 6 ]; then
            echo "::error title=Incomplete release::expected 6 archives, found $count. Nothing was attached."
            exit 1
          fi
          cp ../install.sh ../install.ps1 .
          sha256sum copilotscope-* install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS

      # SLSA build provenance for every file that is about to be attached: a signed statement,
      # kept with the repository, that this workflow run built this exact file from this exact
      # commit. A reader checks it with `gh attestation verify <file> --repo <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/copilotscope-*
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS

      # The container and research-PDF workflows run on the same tag, and whichever gets there
      # first creates the release; the others attach to it. `create` losing that race is fine —
      # the release exists, which is all the upload needs.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes "Native binaries: pick the archive for your platform, check it against SHA256SUMS — or \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\` for build provenance — extract it and run \`copilotscope\`. install.sh and install.ps1 are the installers this release was tested with: \`sh install.sh --version $TAG\` (\`-Version\` on Windows) installs this release rather than the newest. See the README and CHANGELOG.md for what changed." \
              || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          # A new tag is the newest release. A manual rebuild of an older one must not take
          # "latest" away from a newer release, or releases/latest/download would go backwards.
          if [ "$EVENT" = "push" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          fi
          echo "Attached $(ls dist | wc -l) file(s) to $TAG."

  # Windows Package Manager: with the archives attached, the release is submitted to
  # winget-pkgs (.github/workflows/winget.yml). Only on a tag push — a manual rebuild of an
  # existing release re-attaches archives winget already has, and submitting them again would
  # open a duplicate pull request.
  winget:
    needs: [version, release]
    if: needs.version.outputs.publish == 'true' && github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
